name: Lesson reminders

# Well-Read lesson reminder sender.
# Hourly at minute 0, 16 times a day: 11:00-23:00 UTC and 00:00, 01:00, 02:00 UTC
# (`0 11-23,0-2 * * *`). The script only claims and sends from 14:00 inclusive to
# 21:00 exclusive America/Los_Angeles (2 PM-9 PM Pacific). PDT is UTC-7, so that
# window is 21:00-04:00 UTC; PST is UTC-8, so it is 22:00-05:00 UTC. The cron is
# spread across more of the UTC day because GitHub has been starting this job
# 6h40m to 10h04m late (median 7h25m); packing slots into the window itself would
# miss it. UTC day rollover is fine: claim keys use the Los Angeles date. A late
# run outside the window (for example 3 AM Pacific) must no-op and must not claim
# the day. The first in-window start sends; later runs that day are no-ops because
# each user's claim is per Pacific day.
# Emergency stop: set the repo variable WELL_READ_LESSON_REMINDERS to 0 (the sender then exits
# without connecting), or disable this workflow (gh workflow disable lesson-reminders.yml).
on:
  schedule:
    - cron: "0 11-23,0-2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = connect and read only (no claim, no push); send = real run"
        type: choice
        options: [check, send]
        default: check
  pull_request:
    paths:
      - .github/workflows/lesson-reminders.yml
      - scripts/send-lesson-reminders.mjs
      - src/lib/reminders/**

permissions:
  contents: read

# Never run two senders at once; never cancel one mid-send.
concurrency:
  group: lesson-reminders
  cancel-in-progress: false

jobs:
  remind:
    name: remind
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Forks never get secrets; only same-repo PRs run the check.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --prod
      - name: Connectivity check (no claim, no push)
        env:
          LESSON_REMINDER_DB_URL: ${{ secrets.LESSON_REMINDER_DB_URL }}
          WELL_READ_LESSON_REMINDERS: ${{ vars.WELL_READ_LESSON_REMINDERS }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: node scripts/send-lesson-reminders.mjs --check
      - name: Send reminders
        if: github.event_name == 'schedule' || inputs.mode == 'send'
        env:
          LESSON_REMINDER_DB_URL: ${{ secrets.LESSON_REMINDER_DB_URL }}
          WELL_READ_LESSON_REMINDERS: ${{ vars.WELL_READ_LESSON_REMINDERS }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: node scripts/send-lesson-reminders.mjs
